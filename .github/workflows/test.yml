name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # worker-configuration.d.ts is gitignored; generate it before tsc (needs no credentials).
      # https://developers.cloudflare.com/workers/languages/typescript/ (step 5)
      - run: npx wrangler types
      - run: npm run check
      - run: npm test
